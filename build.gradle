buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.anatawa12.com/snapshots/" }
    }
    dependencies {
        // anatawa12's ForgeGradle 1.2 fork: builds 1.7.10 on modern Gradle/JDK
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') { changing = true }
    }
}

apply plugin: 'forge'

version = "0.9.7.1.2"
group = "ivorius.reccomplex"
archivesBaseName = "RecurrentComplex"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    // No explicit mappings: use forge's packaged MCP conf, which is what the
    // original 1.7 build compiled against (adding stable_12 mismatched the source).
}

repositories {
    // Local prebuilt IvToolkit 1.2.1 (dev jar) — the 1.7.10-compatible build
    maven { url "file:///Users/lukas/Downloads/" }
}

dependencies {
    compile 'ivorius.ivtoolkit:IvToolkit:1.2.1:dev'
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    // copy everything else, that's not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
